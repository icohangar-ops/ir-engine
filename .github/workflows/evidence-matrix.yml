name: Evidence Matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-matrix:
    name: Verify evidence matrix
    runs-on: ubuntu-latest
    steps:
      # The matrix gate runs first, with the runner's preinstalled python3 and
      # zero install steps: the vendored verifier is stdlib-only, so capability
      # claims are verified before any dependency is downloaded.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify evidence matrix (fail-closed)
        run: python3 tools/verify_evidence_matrix.py

      # The matrix's test rows are statically checked by the verifier and
      # executed here; this step has no `|| true` escape hatch, so a failing
      # claim test fails the build.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Run capability-claim tests
        run: python3 -m pytest tests/ -q
